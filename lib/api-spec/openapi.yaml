openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BlackBelt Commandos workforce operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: operations
    description: Workforce operations
  - name: requests
    description: Employee requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getWorkforceSession
      tags: [operations]
      summary: Get the signed-in user's workforce access
      responses:
        "200":
          description: Authenticated role and assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceSession"
  /admin/field-officers:
    get:
      operationId: getAdminFieldOfficers
      tags: [operations]
      summary: Get field officer records available for access assignment
      responses:
        "200":
          description: Field officer records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldOfficerRecord"
  /admin/workforce-users:
    get:
      operationId: getAdminWorkforceUsers
      tags: [operations]
      summary: Find Clerk users and their workforce assignments
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Clerk users with workforce assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkforceUser"
  /admin/workforce-users/{userId}/assignment:
    patch:
      operationId: updateAdminWorkforceUserAssignment
      tags: [operations]
      summary: Assign a workforce role and site to a Clerk user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkforceUserAssignment"
      responses:
        "200":
          description: Updated workforce assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceUser"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [operations]
      summary: Get operations dashboard summary
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /policies/operating:
    get:
      operationId: getOperatingPolicy
      tags: [operations]
      summary: Get the active operating policy
      responses:
        "200":
          description: Active site and workforce operating rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingPolicy"
    patch:
      operationId: updateOperatingPolicy
      tags: [operations]
      summary: Update the active operating policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatingPolicyUpdate"
      responses:
        "200":
          description: Updated operating policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingPolicy"
        "409":
          description: The policy was changed after the submitted version was loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatingPolicyConflict"
  /policies/operating/revisions:
    get:
      operationId: getOperatingPolicyRevisions
      tags: [operations]
      summary: Get a page of operating policy revisions
      parameters:
        - name: offset
          in: query
          description: Number of newest revisions to skip
          schema:
            type: number
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Maximum revisions to return
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Policy revisions ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatingPolicyRevision"
  /policies/operating/revisions/{revisionId}/export:
    get:
      operationId: exportOperatingPolicyRevision
      tags: [operations]
      summary: Export an operating policy revision comparison
      parameters:
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Readable policy revision comparison
          content:
            text/plain:
              schema:
                type: string
  /activity:
    get:
      operationId: getActivity
      tags: [operations]
      summary: Get recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /attendance/today:
    get:
      operationId: getTodayAttendance
      tags: [operations]
      summary: Get today's attendance record
      responses:
        "200":
          description: Attendance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
  /attendance/punch:
    post:
      operationId: punchAttendance
      tags: [operations]
      summary: Punch in or out with geofence context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendancePunchInput"
      responses:
        "200":
          description: Updated attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
  /tracking/heartbeat:
    post:
      operationId: postLocationHeartbeat
      tags: [operations]
      summary: Record a Field Officer location heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationHeartbeatInput"
      responses:
        "201":
          description: Persisted location heartbeat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHeartbeat"
  /emergency/sos:
    get:
      operationId: getSosAlerts
      tags: [operations]
      summary: List recorded SOS alerts
      responses:
        "200":
          description: Recorded SOS alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SosAlert"
    post:
      operationId: triggerSos
      tags: [operations]
      summary: Trigger an SOS alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosInput"
      responses:
        "201":
          description: SOS alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosAlert"
  /emergency/sos/{id}/status:
    patch:
      operationId: transitionSos
      tags: [operations]
      summary: Transition an SOS through acknowledgement and dispatch
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosStatusInput"
      responses:
        "200":
          description: Updated SOS alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosAlert"
  /attendance/corrections:
    post:
      operationId: requestAttendanceCorrection
      tags: [operations]
      summary: Request an attendance correction with a reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceCorrectionInput"
      responses:
        "201":
          description: Correction request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCorrection"
  /team/guards:
    get:
      operationId: getTeamGuards
      tags: [operations]
      summary: List reporting guards
      responses:
        "200":
          description: Reporting guards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guard"
  /team/guards/{id}/check-in:
    post:
      operationId: checkInGuard
      tags: [operations]
      summary: Check in a reporting guard
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated guard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guard"
  /checklist/today:
    get:
      operationId: getTodayChecklist
      tags: [operations]
      summary: Get today's checklist
      responses:
        "200":
          description: Checklist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistItem"
  /checklist/{id}:
    patch:
      operationId: updateChecklistItem
      tags: [operations]
      summary: Update a checklist item
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistUpdate"
      responses:
        "200":
          description: Updated checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"
  /contacts:
    get:
      operationId: getEscalationContacts
      tags: [operations]
      summary: Get escalation contacts
      responses:
        "200":
          description: Escalation contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EscalationContact"
  /site-report/today:
    get:
      operationId: getTodaySiteReport
      tags: [operations]
      summary: Get today's site report
      responses:
        "200":
          description: Site report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteReport"
  /tracking/field-officers:
    get:
      operationId: getFieldOfficerTracking
      tags: [operations]
      summary: Get live field officer locations
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: dutyStatus
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Field officer locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldOfficerLocation"
  /patrol/checkpoints:
    get:
      operationId: getPatrolCheckpoints
      tags: [operations]
      summary: List configured QR patrol checkpoints
      responses:
        "200":
          description: Patrol checkpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatrolCheckpoint"
    post:
      operationId: createPatrolCheckpoint
      tags: [operations]
      summary: Configure a QR patrol checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatrolCheckpointInput"
      responses:
        "201":
          description: Created checkpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatrolCheckpoint"
  /patrol/scans:
    post:
      operationId: recordPatrolScan
      tags: [operations]
      summary: Record a QR checkpoint scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatrolScanInput"
      responses:
        "201":
          description: Recorded patrol scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatrolScan"
  /patrol/summary:
    get:
      operationId: getPatrolSummary
      tags: [operations]
      summary: Get persisted patrol completion metrics
      responses:
        "200":
          description: Patrol metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatrolSummary"
  /incidents:
    get:
      operationId: getIncidents
      tags: [operations]
      summary: List structured incidents
      responses:
        "200":
          description: Incident records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      operationId: createIncident
      tags: [operations]
      summary: Report a structured incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "201":
          description: Created incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /incidents/{id}/status:
    patch:
      operationId: transitionIncident
      tags: [operations]
      summary: Transition an incident through its control-room lifecycle
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentStatusInput"
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /roster/today:
    get:
      operationId: getTodayRoster
      tags: [operations]
      summary: List today's persisted roster assignments
      responses:
        "200":
          description: Today's roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterAssignment"
    post:
      operationId: createRosterAssignment
      tags: [operations]
      summary: Add an assignment to today's roster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterAssignmentInput"
      responses:
        "201":
          description: Created roster assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterAssignment"
  /compliance:
    get:
      operationId: getComplianceRecords
      tags: [operations]
      summary: List employee compliance records
      responses:
        "200":
          description: Compliance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceRecord"
  /reports/today:
    get:
      operationId: getTodayOperationalReport
      tags: [operations]
      summary: Get today's persisted Daily Activity Report
      responses:
        "200":
          description: Daily Activity Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalReport"
    post:
      operationId: submitTodayOperationalReport
      tags: [operations]
      summary: Submit or update today's Daily Activity Report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationalReportInput"
      responses:
        "201":
          description: Submitted report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalReport"
  /requests/{id}/status:
    patch:
      operationId: transitionRequest
      tags: [operations]
      summary: Approve or reject an employee request
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestStatusInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestRecord"
  /storage/uploads/request-url:
    post:
      operationId: requestEvidenceUploadUrl
      tags: [operations]
      summary: Create a short-lived private evidence upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUploadInput"
      responses:
        "200":
          description: Signed upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceUpload"
  /employee-submissions:
    get:
      operationId: getEmployeeSubmissions
      tags: [operations]
      summary: Get employee verification submissions
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Employee submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeSubmission"
    post:
      operationId: submitEmployeeDetails
      tags: [operations]
      summary: Submit employee details for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeSubmissionInput"
      responses:
        "201":
          description: Submitted employee record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeSubmission"
  /employee-submissions/{id}/decision:
    patch:
      operationId: decideEmployeeSubmission
      tags: [operations]
      summary: Accept, reject, or send back an employee submission
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeDecisionInput"
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeSubmission"
  /payslips:
    get:
      operationId: getPayslips
      tags: [operations]
      summary: Get available payslips
      responses:
        "200":
          description: Payslips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payslip"
  /requests:
    get:
      operationId: getRequests
      tags: [requests]
      summary: List submitted employee requests
      responses:
        "200":
          description: Submitted requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestRecord"
  /requests/leave:
    post:
      operationId: createLeaveRequest
      tags: [requests]
      summary: Submit a leave request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestInput"
      responses:
        "201":
          description: Leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestRecord"
  /requests/salary-advance:
    post:
      operationId: createSalaryAdvanceRequest
      tags: [requests]
      summary: Submit a salary advance request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalaryAdvanceInput"
      responses:
        "201":
          description: Salary advance request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestRecord"
  /requests/bills:
    post:
      operationId: createBillSubmission
      tags: [requests]
      summary: Submit a field bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillSubmissionInput"
      responses:
        "201":
          description: Bill submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestRecord"
  /workforce/workbench:
    get:
      operationId: getWorkforceWorkbench
      tags: [operations]
      summary: Get persisted workforce planning, compliance, command, finance and audit data
      parameters:
        - name: kind
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Workbench records, audit history and operational metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceWorkbench"
  /workforce/items:
    post:
      operationId: createWorkforceItem
      tags: [operations]
      summary: Create a workforce planning, compliance, command, finance or reporting item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkforceItemInput"
      responses:
        "201":
          description: Created workforce item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceItem"
  /workforce/items/{id}:
    patch:
      operationId: updateWorkforceItem
      tags: [operations]
      summary: Update a workforce item
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkforceItemUpdate"
      responses:
        "200":
          description: Updated workforce item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceItem"
  /workforce/items/{id}/transition:
    post:
      operationId: transitionWorkforceItem
      tags: [operations]
      summary: Transition a workforce item and record the action in audit history
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkforceItemTransition"
      responses:
        "200":
          description: Transitioned workforce item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceItem"
  /workforce/audit:
    get:
      operationId: getWorkforceAudit
      tags: [operations]
      summary: Get attributable workforce audit history
      responses:
        "200":
          description: Audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    DashboardSummary:
      type: object
      required: [coverage, attendance, patrol, incidents, openApprovals, fieldOfficers]
      properties:
        coverage: { type: number }
        attendance: { type: number }
        patrol: { type: number }
        incidents: { type: number }
        openApprovals: { type: number }
        fieldOfficers: { type: number }
    WorkforceSession:
      type: object
      required: [userId, role, siteName, fieldOfficerId, permissions]
      properties:
        userId: { type: string }
        role:
          type: string
          enum: [Guard, Supervisor, Security Officer, Field Officer, Management, Control Room]
        siteName: { type: string }
        fieldOfficerId: { type: ["string", "null"] }
        permissions:
          type: object
          required: [canViewEmployeeDetails, canViewFieldTracking, canManageTeam, canManagePolicies]
          properties:
            canViewEmployeeDetails: { type: boolean }
            canViewFieldTracking: { type: boolean }
            canManageTeam: { type: boolean }
            canManagePolicies: { type: boolean }
    FieldOfficerRecord:
      type: object
      required: [id, name, city, dutyStatus]
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        dutyStatus: { type: string }
    WorkforceUser:
      type: object
      required: [userId, displayName, email, role, siteName, fieldOfficerId, assignmentUpdatedAt, assignmentUpdatedBy]
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: string, nullable: true }
        role:
          type: string
          enum: [Guard, Supervisor, Security Officer, Field Officer, Management, Control Room]
        siteName: { type: string }
        fieldOfficerId: { type: string, nullable: true }
        assignmentUpdatedAt: { type: string, nullable: true }
        assignmentUpdatedBy: { type: string, nullable: true }
    WorkforceUserAssignment:
      type: object
      required: [role, siteName]
      properties:
        role:
          type: string
          enum: [Guard, Supervisor, Security Officer, Field Officer, Management, Control Room]
        siteName: { type: string, minLength: 1 }
        fieldOfficerId: { type: string, nullable: true }
    Activity:
      type: object
      required: [id, title, detail, time, tone]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        time: { type: string }
        tone: { type: string }
    AttendanceRecord:
      type: object
      required: [id, employeeName, shift, site, status, punchIn, punchOut, geofence, siteAddress, geofenceRadiusMeters, shiftWindow, punchInVerification, punchOutVerification]
      properties:
        id: { type: string }
        employeeName: { type: string }
        shift: { type: string }
        site: { type: string }
        status: { type: string }
        punchIn: { type: ["string", "null"] }
        punchOut: { type: ["string", "null"] }
        geofence: { type: string }
        punchInVerification: { type: ["string", "null"] }
        punchOutVerification: { type: ["string", "null"] }
        punchInAccuracyMeters: { type: ["number", "null"] }
        punchOutAccuracyMeters: { type: ["number", "null"] }
        siteAddress: { type: string }
        geofenceRadiusMeters: { type: number }
        shiftWindow: { type: string }
    AttendancePunchInput:
      type: object
      required: [action, location]
      properties:
        action:
          type: string
          enum: [in, out]
        location: { type: string }
        geofenceVerified: { type: boolean }
        latitude: { type: number, minimum: -90, maximum: 90 }
